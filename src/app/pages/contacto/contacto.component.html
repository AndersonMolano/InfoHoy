<section class="seccion">
  <div class="contenedor">
    <div class="seccion-titulo">
      <h2>Contáctanos</h2>
      <p>¿Tienes dudas, sugerencias o quieres compartir una noticia? Escríbenos.</p>
    </div>

    <div class="mensaje-confirmacion" [class.visible]="mensajeEnviado">
      ¡Gracias! Tu mensaje fue enviado correctamente. Te responderemos pronto.
    </div>

    <form [formGroup]="formulario" (ngSubmit)="enviar()" class="form-contacto" novalidate>
      <div class="campo" [class.invalido]="campoInvalido('nombre')">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" formControlName="nombre" placeholder="Escribe tu nombre" />
        <span class="mensaje-error">Este campo es obligatorio.</span>
      </div>

      <div class="campo" [class.invalido]="campoInvalido('correo')">
        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" formControlName="correo" placeholder="tucorreo@ejemplo.com" />
        <span class="mensaje-error">Ingresa un correo electrónico válido.</span>
      </div>

      <div class="campo" [class.invalido]="campoInvalido('asunto')">
        <label for="asunto">Asunto</label>
        <input type="text" id="asunto" formControlName="asunto" placeholder="¿Sobre qué quieres escribirnos?" />
        <span class="mensaje-error">Este campo es obligatorio.</span>
      </div>

      <div class="campo" [class.invalido]="campoInvalido('mensaje')">
        <label for="mensaje">Mensaje</label>
        <textarea id="mensaje" formControlName="mensaje" placeholder="Escribe tu mensaje aquí..."></textarea>
        <span class="mensaje-error">Este campo es obligatorio.</span>
      </div>

      <button type="submit" class="btn btn-primario" style="width:100%;">Enviar mensaje</button>
    </form>
  </div>
</section>
