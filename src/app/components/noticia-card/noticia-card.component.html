<article class="card">
  <img [src]="noticia.imagen" [alt]="noticia.titulo" />
  <div class="card-cuerpo">
    <span class="card-categoria">{{ noticia.categoria }}</span>
    <h3>{{ noticia.titulo }}</h3>
    <p>{{ noticia.descripcionBreve }}</p>
    <div class="card-footer">
      <a class="card-ver-mas" [routerLink]="['/noticias', noticia.id]">Ver más &rarr;</a>

      <button
        *ngIf="mostrarBotonFavorito"
        type="button"
        class="btn-favorito"
        [class.activo]="esFavorita"
        [title]="esFavorita ? 'Quitar de favoritos' : 'Agregar a favoritos'"
        (click)="alTogglearFavorito($event)"
      >
        {{ esFavorita ? '♥' : '♡' }}
      </button>
    </div>
  </div>
</article>
