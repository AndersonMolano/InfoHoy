<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administrar noticias | InfoHoy</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .tabla-admin { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: var(--sombra); margin-top: 30px; }
    .tabla-admin th, .tabla-admin td { text-align: left; padding: 12px 16px; border-bottom: 1px solid #e5e7eb; font-size: 0.92rem; }
    .tabla-admin th { background-color: #f4f6fb; }
    .btn-eliminar { background-color: #fee2e2; color: #b91c1c; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .btn-eliminar:hover { background-color: #fecaca; }
    select#categoria { width: 100%; padding: 12px 14px; border-radius: 8px; border: 1px solid var(--color-borde); font-family: inherit; }
  </style>
</head>
<body>

  <header class="header">
    <div class="contenedor">
      <a href="index.html" class="marca">
        <img src="img/logo.svg" alt="Logo InfoHoy" width="40" height="40">
        InfoHoy
      </a>
      <nav class="nav">
        <a href="index.html">Inicio</a>
        <a href="listado.html">Noticias</a>
        <a href="mis-favoritos.html">Favoritos</a>
        <a href="admin.html">Administrar</a>
        <a href="contacto.html">Contacto</a>
      </nav>
      <button class="nav-toggle" aria-label="Abrir menú">&#9776;</button>
    </div>
  </header>

  <section class="seccion">
    <div class="contenedor">
      <div class="seccion-titulo">
        <h2>Administrar noticias</h2>
        <p>Gestión básica (Mini CRUD): crear y eliminar noticias</p>
      </div>

      <form id="form-crear-noticia" class="form-contacto" style="max-width:100%;">
        <div class="campo">
          <label for="titulo">Título</label>
          <input type="text" id="titulo" name="titulo" placeholder="Título de la noticia">
        </div>

        <div class="campo">
          <label for="categoria">Categoría</label>
          <select id="categoria" name="categoria">
            <option value="Tecnología">Tecnología</option>
            <option value="Educación">Educación</option>
            <option value="Turismo">Turismo</option>
            <option value="Comercial">Comercial</option>
          </select>
        </div>

        <div class="campo">
          <label for="descripcionBreve">Descripción breve</label>
          <input type="text" id="descripcionBreve" name="descripcionBreve" placeholder="Resumen corto para la tarjeta">
        </div>

        <div class="campo">
          <label for="descripcionCompleta">Descripción completa</label>
          <textarea id="descripcionCompleta" name="descripcionCompleta" placeholder="Contenido completo de la noticia"></textarea>
        </div>

        <div class="campo">
          <label for="imagen">Ruta de imagen (opcional)</label>
          <input type="text" id="imagen" name="imagen" placeholder="img/mi-imagen.svg">
        </div>

        <div class="campo">
          <label for="autor">Autor (opcional)</label>
          <input type="text" id="autor" name="autor" placeholder="Nombre del autor">
        </div>

        <button type="submit" class="btn btn-primario" style="width:100%;">Crear noticia</button>
      </form>

      <table class="tabla-admin">
        <thead>
          <tr>
            <th>Título</th>
            <th>Categoría</th>
            <th>Fecha</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody id="cuerpo-tabla-noticias">
          <!-- Se renderiza dinámicamente con JavaScript (admin.js) -->
        </tbody>
      </table>
    </div>
  </section>

  <footer class="footer">
    <div class="contenedor">
      <div class="footer-bottom">
        &copy; 2026 InfoHoy. Proyecto académico - Módulo Front-end 😉.
      </div>
    </div>
  </footer>

  <script src="js/datos.js"></script>
  <script src="js/main.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
